{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الی گشت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* استایل کلی صفحه */
        body {
            font-family: Vazirmatn, sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            position: relative;
        }

        /* استایل عنوان */
        .title {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            color: #fff;
            z-index: 2; /* قرار دادن عنوان روی پس‌زمینه */
        }

        /* استایل پنل */
        .panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            z-index: 2; /* قرار دادن پنل روی پس‌زمینه */
        }

        /* استایل کارت‌ها */
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }

        .card p {
            margin: 10px 0 0;
            font-size: 1rem;
            color: #ddd;
        }

        /* استایل پس‌زمینه */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        /* استایل برای موبایل */
        @media (max-width: 768px) {
            .panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- عنوان صفحه -->
    <h1 class="title">✈️ Mahangasht - Explore the Sky</h1>

    <!-- پنل دکمه‌ها -->
    <div class="panel">
        <a href="{% url 'flight:index' %}" class="card">
            <h2>پرواز داخلی</h2>
            <p>امتحانش کن، ضرر نداره</p>
        </a>
        <a href="page2.html" class="card">
            <h2>پرواز خارجی</h2>
            <p>امتحانش کن، ضرر نداره</p>
        </a>
        <a href="page3.html" class="card">
            <h2>هتل</h2>
            <p>امتحانش کن، ضرر نداره</p>
        </a>
        <a href="page4.html" class="card">
            <h2>تور</h2>
            <p>امتحانش کن، ضرر نداره</p>
        </a>
    </div>

    <!-- کانواس Three.js برای پس‌زمینه -->
    <div id="bgCanvas"></div>

    <script>
        // تنظیم صحنه
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("bgCanvas").appendChild(renderer.domElement);

        // ایجاد ذرات متحرک
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 500;
        const positions = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particlesMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);

        scene.add(particlesMesh);

        camera.position.z = 5;

        // انیمیشن
        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            renderer.render(scene, camera);
        }

        animate();

        // تنظیم اندازه مجدد صفحه
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
